name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - fix/security-auth-docs-review

permissions:
  contents: read

jobs:
  quality:
    name: Tests, lint and workspace builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all tests
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Check scaffold contract
        run: pnpm check:contract

      - name: Build server
        run: pnpm --filter server build

      - name: Build client
        run: pnpm --filter client build
