    <script id="debug-error-catcher">
      window.addEventListener('error', function(e) {
        var r = document.getElementById('root');
        if (r) {
          r.innerHTML = '<div style="padding:20px;color:#721c24;background:#f8d7da;border:1px solid #f5c6cb;margin:20px;border-radius:8px;font-family:sans-serif;"><h3>Erro na Aplicação:</h3><p><b>' + (e.message || 'Erro desconhecido') + '</b></p><p><small>' + (e.filename || '') + ':' + (e.lineno || '') + '</small></p></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var r = document.getElementById('root');
        if (r) {
          r.innerHTML = '<div style="padding:20px;color:#721c24;background:#f8d7da;border:1px solid #f5c6cb;margin:20px;border-radius:8px;font-family:sans-serif;"><h3>Erro na Requisição/API:</h3><p><b>' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</b></p></div>';
        }
      });
    </script>
